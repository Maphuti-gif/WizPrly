name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project Root
        run: |
          PROJ_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$PROJ_FILE" ]; then
            PROJ_DIR=$(dirname "$PROJ_FILE")
          else
            PROJ_DIR="."
          fi
          echo "Found project at: $PROJ_DIR"
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Make Gradlew Executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build KMP Shared Framework
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :shared:assemble

      - name: Build iOS App & Archive
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/iosApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p iosApp/build/ipa
          cd iosApp/build/iosApp.xcarchive/Products/Applications
          zip -r ../../../../ipa/WizPrly.ipa iosApp.app

      - name: Upload IPA Artifact File
        uses: actions/upload-artifact@v4
        with:
          name: WizPrly-iOS-IPA
          path: ${{ env.PROJECT_DIR }}/iosApp/build/ipa/WizPrly.ipa

name: Build iOS App & Simulator

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project Root
        run: |
          PROJ_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$PROJ_FILE" ]; then
            PROJ_DIR=$(dirname "$PROJ_FILE")
          else
            PROJ_DIR="."
          fi
          echo "Found project at: $PROJ_DIR"
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build KMP Shared Framework
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :shared:assemble

      - name: Build iOS Simulator App
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/derivedData \
            build

      - name: Upload Appetize.io Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: WizPrly-iOS-Simulator
          path: ${{ env.PROJECT_DIR }}/iosApp/build/derivedData/Build/Products/Release-iphonesimulator/iosApp.app

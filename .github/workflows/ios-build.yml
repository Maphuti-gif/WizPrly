name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build KMP Shared Framework
        run: gradle :shared:assemble

      - name: Build iOS App & Archive
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/iosApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p iosApp/build/ipa
          cd iosApp/build/iosApp.xcarchive/Products/Applications
          zip -r ../../../../ipa/WizPrly.ipa iosApp.app

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WizPrly-iOS-IPA
          path: iosApp/build/ipa/WizPrly.ipa
